# Entity ids are <prefix>_<thing>; prefix defaults to the short hostname.
# prefix = "laptop"
device_name = "Laptop"
# Terminals the password may be typed into (niri app_id). Lock screen and polkit are always allowed.
allowed_app_ids = ["foot", "footclient", "org.kde.konsole", "Alacritty"]
# MPRIS player exposed as the "music" fan (empty disables).
player = "Feishin"
# systemd user unit driven by the "job" toggle (empty disables).
job_unit = ""
# hwmon name for power, temperature and fan sensors.
hwmon = "macsmc_hwmon"
# Toggles that only act when pressed from Apple Home (HomeKit Bridge).
homekit_only = []
# Push an approve/deny request whenever a sudo or polkit prompt appears.
notify_prompts = true

[ha]
url = "https://homeassistant.example.ts.net"
# notify service for the phone (Settings > Companion app), without the "notify." prefix.
notify_service = "mobile_app_phone"
# Optional: used by ha-remote-setup for the leave/arrive automations.
person = "person.me"
# Optional: switch turned off once you have been away from home for 10 min.
# desk_switch = "switch.desk"   # turned off 10 min after you leave home

# Only notification actions fired by this HA user (the phone app's login) may approve typing.
# Find it under Settings > People, or in the log of a rejected approval.
[ha.approver]
user_id = "<ha user id>"
