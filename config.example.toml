device_name = "M2"
# Typing is also allowed when the screen is locked or noctalia's polkit panel is open.
allowed_app_ids = ["foot", "footclient", "spterminal", "org.kde.konsole", "konsole", "Alacritty"]
player = "Feishin"
job_unit = "autobuild-everything.service"
homekit_only = []

[ha]
url = "https://homeassistant.example.ts.net"
notify_service = "mobile_app_phone"
# Secrets live in the keyring:
#   secret-tool store --label="ha-remote token" service ha-remote key token
#   secret-tool store --label="ha-remote unlock" service ha-remote key unlock
# Used by ha-setup only
person = "person.me"
desk_switch = "switch.desk"
notify_prompts = true

# Only notification actions fired by this HA user (the phone app's login) may approve typing.
[ha.approver]
user_id = "<ha user id>"
