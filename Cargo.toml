[package]
name = "ha-remote"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ipnet = "2"
libc = "0.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "native-tls"] }
toml = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = true
